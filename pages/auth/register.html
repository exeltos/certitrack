<!DOCTYPE html><html lang="el"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><style>html{background:#f6f8fb}html.ct-prepaint body{visibility:hidden}</style><script>document.documentElement.classList.add('ct-prepaint');addEventListener('DOMContentLoaded',()=>document.documentElement.classList.remove('ct-prepaint'),{once:true});</script><title>CertiTrack - Εγγραφή Οργανισμού</title><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="https://unpkg.com/lucide@latest" defer></script><link rel="stylesheet" href="../../assets/styles/app.css?v=40"><script type="module" src="../../src/components/appShell.js"></script><script type="module" src="../../src/shared/passwordVisibility.js"></script></head><body data-page="auth-register"><div id="app-header"></div><main class="ct-auth-screen"><section class="ct-auth-panel ct-auth-panel--wide"><header class="ct-auth-heading"><span class="ct-auth-eyebrow">CertiTrack</span><h1>Εγγραφή Οργανισμού</h1><p>Κάθε επιχείρηση δημιουργεί έναν ενιαίο χώρο, διαχειρίζεται τα πιστοποιητικά της και συνδέεται με συνεργάτες.</p></header><form id="registerForm" class="ct-auth-form"><div class="ct-auth-grid"><div class="ct-field ct-field--full"><label for="name">Επωνυμία</label><input id="name" name="name" autocomplete="organization" required></div><div class="ct-field ct-field--full"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="ct-field"><label for="afm">ΑΦΜ</label><input id="afm" name="afm" inputmode="numeric" required></div><div class="ct-field"><label for="afmConfirm">Επιβεβαίωση ΑΦΜ</label><input id="afmConfirm" name="afmConfirm" inputmode="numeric" required></div><div class="ct-field"><label for="password">Κωδικός</label><div class="ct-auth-password"><input id="password" name="password" type="password" autocomplete="new-password" required><button type="button" class="ct-auth-password__toggle" data-password-toggle data-target="password"><i data-lucide="eye"></i></button></div></div><div class="ct-field"><label for="passwordConfirm">Επιβεβαίωση</label><div class="ct-auth-password"><input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" required><button type="button" class="ct-auth-password__toggle" data-password-toggle data-target="passwordConfirm"><i data-lucide="eye"></i></button></div></div></div><p class="ct-auth-hint">Ο κωδικός πρέπει να έχει τουλάχιστον 12 χαρακτήρες, κεφαλαίο, πεζό, αριθμό και σύμβολο.</p><p id="errorMsg" class="ct-auth-error hidden"></p><div class="ct-auth-actions"><button id="submitBtn" class="ct-btn ct-btn-primary" type="submit"><i id="spinner" data-lucide="loader-circle" class="hidden"></i> Δημιουργία οργανισμού</button></div></form><div class="ct-auth-links">Έχετε λογαριασμό; <a href="./login.html">Σύνδεση</a></div></section></main><div id="app-footer"></div><script type="module" src="../../src/pages/auth/organizationRegister.js"></script></body></html>
