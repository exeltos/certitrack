<!DOCTYPE html>
<html lang="el">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://klutmusrabsizqjnzwpu.supabase.co https://www.certitrack.gr; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CertiTrack - Εγγραφή Εταιρείας</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <link rel="stylesheet" href="../../assets/styles/app.css">
  <script type="module" src="../../src/components/appShell.js"></script>
  <script type="module" src="../../src/shared/passwordVisibility.js"></script>
  <script type="module" src="../../src/pages/auth/companyRegister.js"></script>
</head>
<body data-page="auth-company-register">
  <div id="app-header"></div>
  <main class="ct-auth-screen">
    <section class="ct-auth-panel ct-auth-panel--wide" aria-labelledby="registerTitle">
      <header class="ct-auth-heading">
        <span class="ct-auth-eyebrow">CertiTrack</span>
        <h1 id="registerTitle">Εγγραφή Εταιρείας</h1>
        <p>Δημιουργήστε τον χώρο της εταιρείας σας για προμηθευτές, πιστοποιητικά και απαιτήσεις συμμόρφωσης.</p>
      </header>
      <form id="registerForm" class="ct-auth-form">
        <div class="ct-auth-grid">
          <div class="ct-field ct-field--full">
            <label for="name">Όνομα Εταιρείας</label>
            <input id="name" name="name" type="text" autocomplete="organization" placeholder="Όνομα Εταιρείας" required>
          </div>
          <div class="ct-field ct-field--full">
            <label for="email">Email Εταιρείας</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="Email Εταιρείας" required>
          </div>
          <div class="ct-field">
            <label for="afm">ΑΦΜ</label>
            <input id="afm" name="afm" type="text" inputmode="numeric" autocomplete="off" placeholder="ΑΦΜ" required>
          </div>
          <div class="ct-field">
            <label for="afmConfirm">Επιβεβαίωση ΑΦΜ</label>
            <input id="afmConfirm" name="afmConfirm" type="text" inputmode="numeric" autocomplete="off" placeholder="Επιβεβαίωση ΑΦΜ" required>
          </div>
          <div class="ct-field">
            <label for="password">Κωδικός</label>
            <div class="ct-auth-password">
              <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Κωδικός" required>
              <button type="button" class="ct-auth-password__toggle" data-password-toggle data-target="password" aria-label="Προβολή κωδικού" title="Προβολή κωδικού"><i data-lucide="eye"></i></button>
            </div>
          </div>
          <div class="ct-field">
            <label for="passwordConfirm">Επιβεβαίωση Κωδικού</label>
            <div class="ct-auth-password">
              <input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" placeholder="Επιβεβαίωση Κωδικού" required>
              <button type="button" class="ct-auth-password__toggle" data-password-toggle data-target="passwordConfirm" aria-label="Προβολή κωδικού" title="Προβολή κωδικού"><i data-lucide="eye"></i></button>
            </div>
          </div>
        </div>
        <p id="errorMsg" class="ct-auth-error hidden" role="alert"></p>
        <div class="ct-auth-actions">
          <button id="submitBtn" type="submit" class="ct-btn ct-btn-primary">
            <i id="spinner" data-lucide="loader-circle" class="hidden"></i>
            Εγγραφή
          </button>
        </div>
      </form>
      <div class="ct-auth-links">Έχετε ήδη λογαριασμό; <a href="./login.html">Σύνδεση</a></div>
    </section>
  </main>
  <div id="app-footer"></div>
</body>
</html>
