<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Επαναφορά Κωδικού - CertiTrack</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <link rel="stylesheet" href="../../assets/styles/app.css">
  <script type="module" src="../../src/components/appShell.js"></script>
  <script type="module" src="../../src/shared/passwordVisibility.js"></script>
  <script src="../../src/pages/auth/resetHash.js"></script>
  <script type="module" src="../../src/pages/auth/resetPassword.js"></script>
</head>
<body data-page="auth-reset">
  <div id="app-header"></div>
  <main class="ct-auth-screen">
    <section class="ct-auth-panel" aria-labelledby="resetTitle">
      <header class="ct-auth-heading">
        <span class="ct-auth-eyebrow">CertiTrack</span>
        <h1 id="resetTitle">Ορισμός Νέου Κωδικού</h1>
        <p>Επιλέξτε νέο κωδικό πρόσβασης για τον λογαριασμό σας.</p>
      </header>
      <form id="resetForm" class="ct-auth-form">
        <div class="ct-field">
          <label for="newPassword">Νέος Κωδικός</label>
          <div class="ct-auth-password">
            <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" placeholder="Νέος Κωδικός" required>
            <button type="button" class="ct-auth-password__toggle" data-password-toggle data-target="newPassword" aria-label="Προβολή κωδικού" title="Προβολή κωδικού"><i data-lucide="eye"></i></button>
          </div>
        </div>
        <div class="ct-field">
          <label for="confirmPassword">Επιβεβαίωση Κωδικού</label>
          <div class="ct-auth-password">
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Επιβεβαίωση Κωδικού" required>
            <button type="button" class="ct-auth-password__toggle" data-password-toggle data-target="confirmPassword" aria-label="Προβολή κωδικού" title="Προβολή κωδικού"><i data-lucide="eye"></i></button>
          </div>
        </div>
        <div class="ct-auth-actions">
          <button type="submit" class="ct-btn ct-btn-primary">Ορισμός Κωδικού</button>
        </div>
      </form>
    </section>
  </main>
  <div id="app-footer"></div>
</body>
</html>
