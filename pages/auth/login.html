<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CertiTrack - Σύνδεση</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <link rel="stylesheet" href="../../assets/styles/app.css">
  <script type="module" src="../../src/components/appShell.js"></script>
  <script type="module" src="../../src/shared/passwordVisibility.js"></script>
  <script type="module" src="../../src/pages/auth/login.js"></script>
</head>
<body data-page="auth-login">
  <div id="app-header"></div>
  <main class="ct-auth-screen">
    <section class="ct-auth-panel" aria-labelledby="loginTitle">
      <header class="ct-auth-heading">
        <span class="ct-auth-eyebrow">CertiTrack</span>
        <h1 id="loginTitle">Σύνδεση</h1>
        <p>Συνδεθείτε στον λογαριασμό εταιρείας, προμηθευτή ή διαχειριστή.</p>
      </header>
      <form id="loginForm" class="ct-auth-form">
        <div class="ct-field">
          <label for="username">ΑΦΜ ή Admin</label>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="ΑΦΜ ή Admin" required>
        </div>
        <div class="ct-field">
          <label for="password">Κωδικός</label>
          <div class="ct-auth-password">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Κωδικός" required>
            <button type="button" id="togglePwd" class="ct-auth-password__toggle" aria-label="Προβολή κωδικού" title="Προβολή κωδικού">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>
        <div class="ct-auth-actions">
          <button id="submitBtn" type="submit" class="ct-btn ct-btn-primary">Είσοδος</button>
        </div>
      </form>
      <div class="ct-auth-links">
        <div>Δεν έλαβα email επιβεβαίωσης; <a href="#" id="resend-confirmation">Ξαναστείλε</a></div>
        <a href="./forgot.html">Ξέχασα τον κωδικό</a>
      </div>
    </section>
  </main>
  <div id="app-footer"></div>
</body>
</html>
