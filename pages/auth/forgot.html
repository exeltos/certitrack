<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style id="ct-prepaint">html{background:#f6f8fb}html.ct-prepaint body{visibility:hidden}</style>
  <script>document.documentElement.classList.add('ct-prepaint');addEventListener('DOMContentLoaded',()=>document.documentElement.classList.remove('ct-prepaint'),{once:true});</script>
  <title>Ξέχασα Κωδικό - CertiTrack</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <link rel="stylesheet" href="../../assets/styles/app.css?v=45">
  <script type="module" src="../../src/components/appShell.js"></script>
  <script type="module" src="../../src/pages/auth/forgot.js"></script>
</head>
<body data-page="auth-forgot">
  <div id="app-header"></div>
  <main class="ct-auth-screen">
    <section class="ct-auth-panel" aria-labelledby="forgotTitle">
      <header class="ct-auth-heading">
        <span class="ct-auth-eyebrow">CertiTrack</span>
        <h1 id="forgotTitle">Ξέχασα Κωδικό</h1>
        <p>Πληκτρολογήστε το email του λογαριασμού σας. Αν υπάρχει ενεργός λογαριασμός, θα λάβετε ασφαλή σύνδεσμο επαναφοράς.</p>
      </header>
      <form id="forgotForm" class="ct-auth-form">
        <div class="ct-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="name@company.gr" required>
        </div>
        <div class="ct-auth-actions">
          <button type="submit" class="ct-btn ct-btn-primary">Αποστολή Link Επαναφοράς</button>
        </div>
      </form>
      <div class="ct-auth-links"><a href="./login.html">Επιστροφή στη σύνδεση</a></div>
    </section>
  </main>
  <div id="app-footer"></div>
</body>
</html>
