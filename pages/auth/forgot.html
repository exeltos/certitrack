<!DOCTYPE html>
<html lang="el">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://klutmusrabsizqjnzwpu.supabase.co https://www.certitrack.gr; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:;">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ξέχασα Κωδικό - CertiTrack</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <link rel="stylesheet" href="../../assets/styles/app.css">
  <script type="module" src="../../src/components/appShell.js"></script>
  <script type="module" src="../../src/pages/auth/forgot.js"></script>
</head>
<body data-page="auth-forgot">
  <div id="app-header"></div>
  <main class="ct-auth-screen">
    <section class="ct-auth-panel" aria-labelledby="forgotTitle">
      <header class="ct-auth-heading">
        <span class="ct-auth-eyebrow">CertiTrack</span>
        <h1 id="forgotTitle">Ξέχασα Κωδικό</h1>
        <p>Επιβεβαιώστε το ΑΦΜ και το email του λογαριασμού για να λάβετε σύνδεσμο επαναφοράς.</p>
      </header>
      <form id="forgotForm" class="ct-auth-form">
        <div class="ct-field">
          <label for="afm">ΑΦΜ Χρήστη</label>
          <input id="afm" name="afm" type="text" inputmode="numeric" autocomplete="username" placeholder="ΑΦΜ Χρήστη" required>
        </div>
        <div class="ct-field">
          <label for="email">Email Χρήστη</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="Email Χρήστη" required>
        </div>
        <div class="ct-auth-actions">
          <button type="submit" class="ct-btn ct-btn-primary">Αποστολή Link Επαναφοράς</button>
        </div>
      </form>
      <div class="ct-auth-links"><a href="./login.html">Επιστροφή στη σύνδεση</a></div>
    </section>
  </main>
  <div id="app-footer"></div>
</body>
</html>
