<!DOCTYPE html>
<html lang="el">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1.0" name="viewport"/>
  <title>
   CertiTrack - Πιστοποιητικά
  </title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11">
  </script>
  <script defer="" src="https://unpkg.com/lucide@latest">
  </script>
  <link href="../../assets/styles/app.css?v=21" rel="stylesheet"/>
  <script src="../../src/components/appShell.js" type="module">
  </script>
 </head>
 <body data-page="supplier-certificates">
  <div id="app-header">
  </div>
  <div class="ct-app-layout">
   <div id="app-sidebar">
   </div>
   <div class="ct-app-content">
    <div id="app-page-header">
    </div>
    <main class="ct-content-page ct-workspace">
     <section class="ct-toolbar">
      <div class="ct-toolbar__search">
       <i data-lucide="search">
       </i>
       <input id="searchInput" placeholder="Αναζήτηση τίτλου, τύπου ή αρχείου..." type="search"/>
      </div>
      <select aria-label="Φίλτρο ορατότητας" id="visibilityFilter">
       <option value="all">
        Όλη η ορατότητα
       </option>
       <option value="shared">
        Διαθέσιμα σε συνεργάτες
       </option>
       <option value="private">
        Ιδιωτικά
       </option>
      </select>
      <button class="ct-btn ct-btn-primary" id="addCertFixed">
       <i data-lucide="plus">
       </i>
       Νέο πιστοποιητικό
      </button>
     </section>
     <section class="ct-stat-strip" id="certStats">
      <button class="ct-stat-button" data-stat="total">
       <span>
        Σύνολο
       </span>
       <strong id="stat-total">
        0
       </strong>
      </button>
      <button class="ct-stat-button" data-stat="active">
       <span>
        Ενεργά
       </span>
       <strong id="stat-active">
        0
       </strong>
      </button>
      <button class="ct-stat-button" data-stat="soon">
       <span>
        Προς λήξη
       </span>
       <strong id="stat-soon">
        0
       </strong>
      </button>
      <button class="ct-stat-button" data-stat="expired">
       <span>
        Ληγμένα
       </span>
       <strong id="stat-expired">
        0
       </strong>
      </button>
     </section>
     <section class="ct-selectionbar ct-selectionbar--certs">
      <button class="ct-btn ct-btn-secondary ct-btn-sm hidden" id="selectAllBtn">
       Επιλογή όλων
      </button>
      <button class="ct-btn ct-btn-secondary ct-btn-sm hidden" id="downloadBtn">
       Λήψη
      </button>
     </section>
     <div class="ct-loading hidden" id="loadingCertificates">
      <i data-lucide="loader-circle">
      </i>
      <span>
       Φόρτωση πιστοποιητικών...
      </span>
     </div>
     <div class="ct-empty-block hidden" id="noCertificatesMessage">
      Δεν υπάρχουν πιστοποιητικά.
     </div>
     <section class="ct-certificate-list hidden" data-export-mode="false" id="certContainer">
     </section>
    </main>
   </div>
  </div>
  <div id="app-footer">
  </div>
  <script src="../../src/pages/supplier/certificatesBootstrap.js" type="module">
  </script>
 </body>
</html>
