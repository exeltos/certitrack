<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style id="ct-prepaint">html{background:#f6f8fb}html.ct-prepaint body{visibility:hidden}</style>
  <script>document.documentElement.classList.add('ct-prepaint');addEventListener('DOMContentLoaded',()=>document.documentElement.classList.remove('ct-prepaint'),{once:true});</script>
  <title>CertiTrack - Οι εταιρείες μου</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../src/config/tailwindConfig.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../../assets/styles/app.css?v=21">
  <script type="module" src="../../src/components/appShell.js"></script>
</head>
<body class="min-h-screen flex flex-col" data-page="supplier-companies">
  <div id="app-header"></div>
  <div class="ct-app-layout"><div id="app-sidebar"></div><div class="ct-app-content"><div id="app-page-header"></div>
    <main class="ct-content-page ct-list-page">
      <section class="ct-filterbar">
        <div class="ct-filterbar__search"><i data-lucide="search"></i><input id="companySearch" type="search" placeholder="Αναζήτηση εταιρείας ή ΑΦΜ..."></div>
        <select id="companyAccessFilter"><option value="all">Όλες οι προσβάσεις</option><option value="granted">Με πρόσβαση</option><option value="blocked">Αποκλεισμένες</option></select>
      </section>
      <section class="ct-card ct-panel"><div class="ct-panel__header"><div><h2>Συνεργαζόμενες εταιρείες</h2><p>Ελέγξτε ποιες εταιρείες έχουν πρόσβαση στα κοινόχρηστα πιστοποιητικά σας.</p></div><span id="companyCount" class="ct-list-count">0 εταιρείες</span></div><div id="companiesList" class="ct-company-list"><div class="ct-empty-state">Φόρτωση...</div></div></section>
    </main>
  </div></div>
  <div id="app-footer"></div>
  <script type="module" src="../../src/pages/supplier/companies.js"></script>
</body>
</html>
