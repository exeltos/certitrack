<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style id="ct-prepaint">html{background:#f6f8fb}html.ct-prepaint body{visibility:hidden}</style>
  <script>document.documentElement.classList.add('ct-prepaint');addEventListener('DOMContentLoaded',()=>document.documentElement.classList.remove('ct-prepaint'),{once:true});</script>
  <title>CertiTrack - Προμηθευτές</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../src/config/tailwindConfig.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="../../assets/styles/app.css?v=21">
  <script type="module" src="../../src/components/appShell.js"></script>
</head>
<body class="min-h-screen flex flex-col" data-page="company-suppliers">
  <div id="app-header"></div>
  <div class="ct-app-layout">
    <div id="app-sidebar"></div>
    <div class="ct-app-content">
      <div id="app-page-header"></div>
      <main class="ct-content-page ct-list-page">
        <section id="supplierControls" class="ct-filterbar">
          <div class="ct-filterbar__search"><i data-lucide="search"></i><input id="searchInputSuppliers" type="search" placeholder="Αναζήτηση επωνυμίας, ΑΦΜ ή email..."></div>
          <select id="sortSelect" aria-label="Ταξινόμηση">
            <option value="">Ταξινόμηση</option><option value="name">Επωνυμία</option><option value="afm">ΑΦΜ</option><option value="registered">Εγγεγραμμένοι πρώτα</option><option value="pending">Εκκρεμείς πρώτα</option>
          </select>
          <button id="bulkImportSuppliersBtn" class="ct-btn ct-btn-secondary"><i data-lucide="file-up"></i> Μαζική εισαγωγή</button>
          <button id="addSupplierBtn" class="ct-btn ct-btn-primary"><i data-lucide="plus"></i> Προσθήκη προμηθευτή</button>
        </section>
        <section class="ct-selectionbar" aria-label="Ενέργειες επιλογής">
          <button id="deleteSelectedBtn" class="ct-btn ct-btn-danger ct-btn-sm hidden"><i data-lucide="trash-2"></i> Διαγραφή</button>
          <button id="sendInviteBtn" class="ct-btn ct-btn-secondary ct-btn-sm hidden"><i data-lucide="send"></i> Πρόσκληση</button>
          <button id="downloadSelectedBtn" class="ct-btn ct-btn-secondary ct-btn-sm hidden"><i data-lucide="download"></i> Λήψη</button>
          <span class="ct-list-count"><strong id="supplierCount">0</strong> προμηθευτές</span>
        </section>
        <div id="loading" class="ct-loading hidden"><i data-lucide="loader-circle"></i><span>Φόρτωση...</span></div>
        <section id="dataSection" class="ct-table-shell ct-supplier-table"><table><thead><tr><th class="ct-check-col"><input id="selectAllSuppliers" type="checkbox" aria-label="Επιλογή όλων"></th><th>Επωνυμία</th><th>ΑΦΜ</th><th>Email</th><th>Κατάσταση</th><th>Πιστοποιητικά</th><th class="ct-actions-col">Ενέργειες</th></tr></thead><tbody id="supplierTableBody"></tbody></table></section>
      </main>
    </div>
  </div>
  <div id="app-footer"></div>
  <script type="module" src="../../src/pages/company/suppliers.js"></script>
</body>
</html>
