<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CertiTrack - Καλώς Ήρθατε</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/src/config/tailwindConfig.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="/assets/styles/app.css">\n</head>
<body class="bg-gradient-to-br from-gray-100 to-blue-100 dark:from-gray-800 dark:to-blue-900 min-h-screen flex flex-col transition-all" data-page="home">

  <!-- Header -->
  <div id="app-header"></div>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col items-center justify-center text-center px-4 py-12 space-y-6">
    <h2 class="text-3xl sm:text-4xl md:text-5xl font-extrabold text-blue-700 dark:text-teal-400">
      Καλώς ήρθατε στο CertiTrack
    </h2>
    <p class="text-base sm:text-lg text-gray-700 dark:text-gray-300 max-w-xl">
      Η έξυπνη διαχείριση Εγγράφων για Εταιρείες και Προμηθευτές
    </p>
    <a href="/pages/auth/login.html" class="px-6 py-2 border border-blue-700 text-blue-700 rounded hover:bg-blue-50 dark:hover:bg-teal-50 transition">
      Είσοδος
    </a>
  
    <section class="ct-demo-launcher">
      <div class="ct-demo-launcher__label">Δοκιμή εφαρμογής χωρίς εγγραφή</div>
      <div class="ct-demo-launcher__actions">
        <button type="button" class="ct-btn ct-btn-secondary" data-enter-demo="company">
          <i data-lucide="building-2"></i>
          Demo ως Εταιρεία
        </button>
        <button type="button" class="ct-btn ct-btn-secondary" data-enter-demo="supplier">
          <i data-lucide="truck"></i>
          Demo ως Προμηθευτής
        </button>
      </div>
      <a href="/pages/demo/index.html" class="ct-demo-launcher__overview">Γρήγορη συνολική προβολή demo</a>
    </section>
</main>

  <!-- Footer -->
  <div id="app-footer"></div>

  <!-- Global Loader -->
  <div id="global-loader" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-white"></div>
  </div>

  
  <script type="module" src="/src/components/appShell.js"></script>\n  <script type="module" src="/src/shared/theme.js"></script>\n  <script type="module" src="/src/demo/demoLauncher.js"></script>
</body>
</html>
