[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/reset-password"
  to = "/pages/auth/reset-password.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Scripts only from this site (plus the one inline theme snippet, by hash).
    # Supabase for data, storage (signed PDF URLs) and realtime.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-VlxjFuIHvAcTxEClPi2GcxKHeZghrhWCCu4vlomgKaY='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src 'self' blob: https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

# Vite output: file names contain a content hash, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
